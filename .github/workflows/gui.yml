name: Deploy GUI

# Test the Streamlit GUI against the Gold data on the school server, then restart it.
# Runs on the self-hosted runner (label dat535) after a push to main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'tests/test_app.py'
      - 'requirements.txt'
      - '.github/workflows/gui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, dat535]
    timeout-minutes: 15
    env:
      DAT535_DATA_ROOT: /srv/dat535/data
      DAT535_GUI_PYTHON: /home/ubuntu/dat535-gui-env/bin/python
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Check the GUI environment and Gold data
        run: |
          "$DAT535_GUI_PYTHON" -c 'import streamlit, pandas, pyarrow, altair'
          test -f "$DAT535_DATA_ROOT/gold/kol/runs/gold-kol-53d-2026-v2/gold_manifest.json"

      - name: Test every GUI page
        run: '"$DAT535_GUI_PYTHON" -B -m unittest tests.test_app -v'

      - name: Restart the GUI
        run: bash src/app/run_gui.sh --restart

      - name: Check the GUI answers
        run: |
          for attempt in $(seq 1 15); do
            curl -sf -o /dev/null http://localhost:8501/ && { echo "GUI is up on port 8501"; exit 0; }
            sleep 2
          done
          tail -n 30 "$DAT535_DATA_ROOT/metadata/gui.log"
          exit 1

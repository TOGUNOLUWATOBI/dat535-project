name: Ingest Entur NeTEx

on:
  push:
    branches: [main]
  schedule:
    # At 08:23 UTC on days 1, 4, 7, ... of each month; resets at month boundaries.
    - cron: '23 8 */3 * *'
  workflow_dispatch:
    inputs:
      source_date:
        description: 'Source day YYYY-MM-DD (blank = yesterday in Oslo)'
        required: false
        type: string
      check_only:
        description: 'Only check source availability; skip the archive download'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: entur-netex-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: [self-hosted, linux, dat535]
    timeout-minutes: 60
    env:
      DAT535_DATA_ROOT: ${{ vars.DAT535_DATA_ROOT }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check server Python and persistent storage before checkout
        env:
          CHECK_ONLY: ${{ inputs.check_only }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit('Install Python 3.11 or newer on the school server')
          setting = os.environ.get('DAT535_DATA_ROOT', '')
          if not setting or '\n' in setting or '\r' in setting:
              raise SystemExit('Set repository variable DAT535_DATA_ROOT to an absolute persistent data directory')
          if not Path(setting).is_absolute():
              raise SystemExit('DAT535_DATA_ROOT must be an absolute path')
          root = Path(setting).resolve()
          for name in ('GITHUB_WORKSPACE', 'RUNNER_TEMP'):
              reserved = Path(os.environ[name]).resolve()
              if root.is_relative_to(reserved) or reserved.is_relative_to(root):
                  raise SystemExit(f'DAT535_DATA_ROOT must be separate from {name}')
          if not root.is_dir() or not os.access(root, os.W_OK | os.X_OK):
              raise SystemExit(f'Create persistent storage writable by the runner account first: {root}')
          if os.environ.get('CHECK_ONLY') != 'true' and shutil.disk_usage(root).free < 2 * 1024**3:
              raise SystemExit('Full ingestion requires at least 2 GiB free; add storage or clean verified archives before retrying')
          output = root / 'bronze' / 'entur' / f"run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'INGESTION_OUTPUT={output}\n')
          print(f'Persistent ingestion output: {output}')
          PY

      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run ingestion tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Collect KOL and AKT snapshot
        id: ingest
        env:
          SOURCE_DATE: ${{ inputs.source_date }}
          CHECK_ONLY: ${{ inputs.check_only }}
        shell: bash
        run: |
          args=(--output "$INGESTION_OUTPUT" --remove-national-after-validation --xml-only)
          if [[ -n "$SOURCE_DATE" ]]; then
            args+=(--date "$SOURCE_DATE")
          fi
          if [[ "$CHECK_ONLY" == 'true' ]]; then
            args+=(--check-only)
          fi
          python3 -u -m pipeline.ingestion.poll_entur_netex "${args[@]}"

      - name: Consolidate verified duplicate Bronze files
        if: steps.ingest.outcome == 'success' && inputs.check_only != true
        run: |
          python3 -B -u -m pipeline.bronze_storage \
            --bronze-root "$DAT535_DATA_ROOT/bronze/entur" --apply \
            --report "$INGESTION_OUTPUT/metadata/storage_deduplication.json"

      - name: Run Spark transformation tests
        id: spark_tests
        if: steps.ingest.outcome == 'success' && inputs.check_only != true
        run: bash scripts/run_tests.sh

      - name: Process validated snapshot through Silver and Gold
        id: process
        if: steps.spark_tests.outcome == 'success'
        shell: bash
        run: |
          bash scripts/run_processing.sh \
            --manifest "$INGESTION_OUTPUT/metadata/manifest.json" \
            --data-root "$DAT535_DATA_ROOT"

      - name: Update route history across all processed snapshots
        id: history
        if: steps.process.outcome == 'success'
        shell: bash
        run: |
          bash scripts/run_route_history.sh --data-root "$DAT535_DATA_ROOT"

      - name: Save route-history checks and summary
        if: always() && (steps.history.outcome == 'success' || steps.history.outcome == 'failure')
        env:
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['DAT535_DATA_ROOT']) / 'gold' / 'entur' / 'history'
          runs = sorted(root.glob('*/history-*/metadata/manifest.json'), key=lambda p: p.stat().st_mtime)
          if not runs:
              raise SystemExit('No route-history output found')
          manifest = json.loads(runs[-1].read_text())
          keep = ('status', 'error', 'identity', 'started_at_utc', 'completed_at_utc', 'elapsed_seconds', 'runtime', 'meaning',
                  'renumbering_mappings', 'discontinuations', 'checks', 'summary')
          # The newest output may predate this run if the step failed before writing one.
          report = {'step_outcome': os.environ['HISTORY_OUTCOME'], 'path': str(runs[-1].parent.parent),
                    **{k: manifest.get(k) for k in keep}}
          report['table_timings_seconds'] = {name: entry.get('elapsed_seconds')
                                            for name, entry in manifest.get('tables', {}).items()}
          target = Path(os.environ['INGESTION_OUTPUT']) / 'metadata' / 'route_history.json'
          target.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          print(f"route history {report['status']}: {report['path']}")
          PY

      - name: Save processing checkpoint report
        if: always() && (steps.process.outcome == 'success' || steps.process.outcome == 'failure')
        shell: bash
        run: |
          python3 -m pipeline.checkpoints \
            --state "$DAT535_DATA_ROOT/pipeline_state.sqlite3" \
            > "$INGESTION_OUTPUT/metadata/processing_checkpoints.json"

      - name: Upload a copy of the server's ingestion report
        if: always() && (steps.ingest.outcome == 'success' || steps.ingest.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: entur-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.INGESTION_OUTPUT }}/metadata/
          if-no-files-found: error
          retention-days: 30


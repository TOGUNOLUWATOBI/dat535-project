name: Pipeline tests

on:
  push:
    branches: [main, ft/further-refactoring-and-cleanup]
    paths: ['src/**', 'tests/**', 'requirements.txt', '.github/workflows/tests.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.txt
      - name: Run local fixtures and real Spark tests
        run: python -B -m unittest discover -s tests -t . -v

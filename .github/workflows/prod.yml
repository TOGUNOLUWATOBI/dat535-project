name: Prod workflow

on:
  push:
    # Development pushes validate this workflow; main pushes also run and deploy.
    branches: [main, ft/further-refactoring-and-cleanup]
  workflow_dispatch:
    inputs:
      start_layer:
        description: Start here and run every downstream layer
        type: choice
        options: [bronze, staging, silver, gold]
        default: bronze
      dates:
        description: yesterday (Oslo), comma-separated dates, or manifest
        type: string
        default: yesterday
        required: true
      deploy_gui:
        description: Deploy the production GUI after checks (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dat535-prod
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python and shell syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for root in ('src', '.github/scripts'):
              for path in Path(root).rglob('*.py'):
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
          find src .github/scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Test pipeline orchestration
        run: python -B -m unittest tests.test_dev_workflow -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/dev.yml .github/workflows/prod.yml

  pipeline:
    needs: validate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, dat535]
    timeout-minutes: 360
    concurrency:
      group: dat535-processing
      cancel-in-progress: false
    defaults:
      run:
        working-directory: prod-worktree-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DAT535_SOURCE_ROOT: /srv/dat535/data
      DAT535_GUI_PYTHON: /home/ubuntu/dat535-gui-env/bin/python
      JAVA_HOME: /home/ubuntu/dat535-runtime/java17/jdk-17.0.21+9-jre
      GOOGLE_APPLICATION_CREDENTIALS: ${{ vars.GOOGLE_APPLICATION_CREDENTIALS || '/home/ubuntu/.config/gcp/dat535-bq-key.json' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: prod-worktree-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check installed processing and GUI environments
        env:
          START_LAYER: ${{ inputs.start_layer || 'bronze' }}
        run: |
          /home/ubuntu/spark-env/bin/python -c 'import pyspark, pyarrow'
          "$DAT535_GUI_PYTHON" -c 'import streamlit, pandas, pyarrow, altair'
          test -x "$JAVA_HOME/bin/java"
          free -m
          if [[ "$START_LAYER" == bronze ]]; then
            test -r "$GOOGLE_APPLICATION_CREDENTIALS"
            /home/ubuntu/spark-env/bin/python -c 'import google.auth; from google.cloud import bigquery; google.auth.default()'
          fi
      - name: Run selected layers and GUI smoke checks
        id: run
        env:
          PIPELINE_DATES: ${{ inputs.dates || 'yesterday' }}
          START_LAYER: ${{ inputs.start_layer || 'bronze' }}
        run: |
          /home/ubuntu/spark-env/bin/python .github/scripts/run_dev_pipeline.py \
            --environment prod \
            --source-root "$DAT535_SOURCE_ROOT" \
            --run-root "$DAT535_SOURCE_ROOT/prod/runs/gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --start-layer "$START_LAYER" --dates "$PIPELINE_DATES" \
            --gui-python "$DAT535_GUI_PYTHON"
      - name: Deploy production GUI
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_gui)
        env:
          DAT535_DATA_ROOT: ${{ steps.run.outputs.run_root }}
          DAT535_GOLD_RUN: ${{ steps.run.outputs.gold_dir }}
          DAT535_SILVER_RUNS: ${{ steps.run.outputs.silver_runs_dir }}
          DAT535_GUI_PORT: '8501'
        run: |
          bash src/app/run_gui.sh --restart
          for attempt in $(seq 1 15); do
            curl -sf -o /dev/null http://localhost:8501/ && exit 0
            echo "Waiting for production GUI (attempt $attempt/15)"
            sleep 2
          done
          exit 1
      - name: Attach run summary
        if: always() && steps.run.outputs.run_root != ''
        env:
          PIPELINE_RUN_ROOT: ${{ steps.run.outputs.run_root }}
        run: |
          {
            echo "### Production pipeline"
            echo "Output directory: \`$PIPELINE_RUN_ROOT\`"
            if [[ -f "$PIPELINE_RUN_ROOT/metadata/run.json" ]]; then
              echo '```json'
              cat "$PIPELINE_RUN_ROOT/metadata/run.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.run.outputs.run_root != ''
        with:
          name: prod-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run.outputs.run_root }}/metadata/
          retention-days: 7
          if-no-files-found: warn
